name: Collect season statistics
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Source to collect
        type: choice
        options: [both, sofascore, flashscore]
        default: both
      retry_unavailable:
        description: Check previously unavailable statistics again
        type: boolean
        default: false
      retry_blocked:
        description: Retry a source after fixing its reported error
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: season-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COLLECTION_SOURCE: ${{ inputs.source || 'both' }}
      RETRY_UNAVAILABLE: ${{ inputs.retry_unavailable || 'false' }}
      RETRY_BLOCKED: ${{ inputs.retry_blocked || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check completion
        id: gate
        run: python -m collector.status
      - name: Install dependencies
        if: steps.gate.outputs.needs_work == 'true'
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock
          python -m pip check
      - name: Verify collector
        if: steps.gate.outputs.needs_work == 'true'
        run: |
          python -m compileall -q collector tests
          python -m collector.validate
          python -m unittest discover -s tests -v
      - name: Install browser
        if: steps.gate.outputs.needs_work == 'true' && env.COLLECTION_SOURCE != 'sofascore'
        run: python -m playwright install --with-deps chromium
      - name: Collect bounded batch
        id: batch
        if: steps.gate.outputs.needs_work == 'true'
        shell: bash
        run: |
          args=(--source "$COLLECTION_SOURCE")
          if [[ "$RETRY_UNAVAILABLE" == true ]]; then args+=(--retry-unavailable); fi
          if [[ "$RETRY_BLOCKED" == true ]]; then args+=(--retry-blocked); fi
          python -m collector.run "${args[@]}"
      - name: Save progress and exports
        if: always() && steps.batch.outcome != 'skipped' && steps.batch.outcome != ''
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data filled checkpoints progress.json PROGRESS.md
          if [[ -f COMPLETE.json ]] || git ls-files --error-unmatch COMPLETE.json >/dev/null 2>&1; then
            git add -A -- COMPLETE.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update season statistics and durable checkpoints'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          cat PROGRESS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve checkpoint snapshot if publication fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collection-checkpoints-${{ github.run_id }}
          path: |
            checkpoints/
            data/
            filled/
            progress.json
            PROGRESS.md
          retention-days: 14
